<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sleepy Bean | Coffee Shop</title>

    <link rel="stylesheet" href="./src/output.css">

    <style>

        html {
            scroll-behavior: smooth;
        }

        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* ==================== DARK MODE ==================== */

        body.dark-mode {
            background-color: #111827;
            color: #f9fafb;
        }

        body.dark-mode .light-section {
            background-color: #1f2937 !important;
        }

        body.dark-mode .white-section {
            background-color: #111827 !important;
        }

        body.dark-mode .card {
            background-color: #374151 !important;
        }

        body.dark-mode .dark-text {
            color: #f9fafb !important;
        }

        body.dark-mode .gray-text {
            color: #d1d5db !important;
        }

        body.dark-mode nav {
            background-color: #1f2937 !important;
        }

        body.dark-mode #searchSection {
            background-color: #374151 !important;
        }

        body.dark-mode #searchInput {
            background-color: #1f2937;
            color: white;
            border-color: #6b7280;
        }

        body.dark-mode footer {
            background-color: #030712 !important;
        }

        /* ==================== MOBILE MENU ==================== */

        #mobileMenu {
            display: none;
        }

        #mobileMenu.show {
            display: flex;
        }

    </style>

</head>


<body class="bg-white text-gray-900">


<!-- ================================================== -->
<!-- NAVBAR -->
<!-- ================================================== -->

<nav class="sticky top-0 z-50 bg-white shadow-md transition">

    <div class="max-w-7xl mx-auto px-6 py-4">

        <div class="flex items-center justify-between">

            <!-- Logo -->

            <a href="index.html"
               class="text-2xl md:text-3xl font-bold text-amber-800
                      hover:text-amber-600 transition">

                Sleepy Bean ☕

            </a>


            <!-- Desktop Navigation -->

            <div class="hidden md:flex items-center gap-8">

                <a href="index.html"
                   class="font-semibold text-amber-700
                          hover:text-amber-500 transition">

                    Home

                </a>

                <a href="menu.html"
                   class="text-gray-700 hover:text-amber-600 transition">

                    Menu

                </a>

                <a href="about.html"
                   class="text-gray-700 hover:text-amber-600 transition">

                    About

                </a>

                <a href="contact.html"
                   class="text-gray-700 hover:text-amber-600 transition">

                    Contact

                </a>

            </div>


            <!-- Actions -->

            <div class="flex items-center gap-2">

                <!-- Search -->

                <button
                    id="searchButton"
                    aria-label="Open search"
                    class="w-10 h-10 flex items-center justify-center
                           rounded-full hover:bg-amber-100
                           transition transform hover:scale-110">

                    🔍

                </button>


                <!-- Dark Mode -->

                <button

                    aria-label="Toggle dark mode"
                    class="w-10 h-10 flex items-center justify-center
                           rounded-full hover:bg-amber-100
                           transition transform hover:scale-110">

                    🌙

                </button>


                <!-- Mobile Menu -->

                <button
                    id="menuButton"
                    aria-label="Open menu"
                    class="md:hidden w-10 h-10 flex items-center
                           justify-center rounded-full
                           hover:bg-amber-100 transition">

                    ☰

                </button>

            </div>

        </div>


        <!-- Mobile Navigation -->

        <div id="mobileMenu"
             class="flex-col gap-4 mt-5 pb-4 md:hidden">

            <a href="index.html"
               class="font-semibold text-amber-700
                      hover:text-amber-500 transition">

                Home

            </a>

            <a href="menu.html"
               class="text-gray-700 hover:text-amber-600 transition">

                Menu

            </a>

            <a href="about.html"
               class="text-gray-700 hover:text-amber-600 transition">

                About

            </a>

            <a href="contact.html"
               class="text-gray-700 hover:text-amber-600 transition">

                Contact

            </a>

        </div>

    </div>

</nav>



<!-- ================================================== -->
<!-- SEARCH -->
<!-- ================================================== -->

<section id="searchSection"
         class="hidden bg-amber-50 py-6 px-6">

    <div class="max-w-3xl mx-auto">

        <div class="flex flex-col sm:flex-row gap-3">

            <input
                id="searchInput"
                type="text"
                placeholder="Search coffee..."
                class="flex-1 px-5 py-3 rounded-full
                       border border-amber-300
                       focus:outline-none
                       focus:ring-2
                       focus:ring-amber-500">

            <button
                id="searchSubmit"
                class="px-6 py-3 bg-amber-700
                       text-white rounded-full
                       hover:bg-amber-800
                       hover:scale-105
                       transition">

                Search

            </button>

        </div>

        <p id="searchMessage"
           class="text-center text-amber-700
                  font-semibold mt-4 hidden">

            No coffee found.

        </p>

    </div>

</section>



<!-- ================================================== -->
<!-- HERO -->
<!-- ================================================== -->

                flex items-center
                bg-amber-50 px-6 py-16 transition">

    <div class="max-w-7xl mx-auto w-full

                gap-12 items-center">


        <!-- Hero Text -->

        <div>

            <p class="text-amber-700 font-semibold
                      text-lg mb-4">

                Welcome to Sleepy Bean ☕

            </p>


            <h1 class="dark-text text-5xl
                       md:text-6xl lg:text-7xl
                       font-bold leading-tight mb-6">

                Start Your Day With

                <span class="text-amber-700 block">

                    Perfect Coffee

                </span>

            </h1>


            <p class="gray-text text-gray-600
                      text-lg md:text-xl
                      leading-relaxed
                      max-w-xl mb-8">

                Enjoy freshly brewed coffee made
                with quality beans, delicious flavors,
                and a warm atmosphere made for every
                coffee lover.

            </p>


            <!-- Buttons -->

            <div class="flex flex-wrap gap-4">

                <a href="menu.html"
                   class="px-7 py-3 bg-amber-700
                          text-white rounded-full
                          font-semibold shadow-lg
                          hover:bg-amber-800
                          hover:scale-105
                          transform transition duration-300">

                    Explore Menu ☕

                </a>


                <a href="about.html"
                   class="px-7 py-3
                          border-2 border-amber-700
                          text-amber-700 rounded-full
                          font-semibold
                          hover:bg-amber-700
                          hover:text-white
                          hover:scale-105
                          transform transition duration-300">

                    Learn More

                </a>

            </div>

        </div>



        <!-- Hero Image -->

        <div class="flex justify-center">

            <div class="relative">

                <div class="absolute -inset-4
                            bg-amber-200
                            rounded-3xl
                            blur-2xl opacity-40">
                </div>


                <img
                    src="https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?auto=format&fit=crop&w=900&q=80"
                    alt="Freshly brewed coffee"
                    class="relative w-full max-w-lg
                           h-[450px]
                           object-cover
                           rounded-3xl
                           shadow-2xl
                           hover:scale-105
                           transition duration-500">

            </div>

        </div>

    </div>

</section>



<!-- ================================================== -->
<!-- POPULAR COFFEE -->
<!-- ================================================== -->

<section class="white-section py-20 px-6
                bg-white transition">

    <div class="max-w-7xl mx-auto">


        <!-- Title -->

        <div class="text-center mb-14">

            <p class="text-amber-700
                      font-semibold mb-2">

            <script>

document.addEventListener("DOMContentLoaded", function () {

    // SEARCH
    const searchButton = document.getElementById("searchButton");
    const searchSection = document.getElementById("searchSection");
    const searchInput = document.getElementById("searchInput");
    const searchSubmit = document.getElementById("searchSubmit");
    const searchMessage = document.getElementById("searchMessage");

    const coffeeCards = document.querySelectorAll(".coffee-card");


    if (searchButton) {

        searchButton.addEventListener("click", function () {

            searchSection.classList.toggle("hidden");

            if (!searchSection.classList.contains("hidden")) {
                searchInput.focus();
            }

        });

    }


    function searchCoffee() {

        const value = searchInput.value.toLowerCase().trim();

        let found = false;


        coffeeCards.forEach(function (card) {

            const name =
                card.querySelector("h3").textContent.toLowerCase();

            const description =
                card.querySelector("p").textContent.toLowerCase();


            if (
                value === "" ||
                name.includes(value) ||
                description.includes(value)
            ) {

                card.style.display = "";
                found = true;

            } else {

                card.style.display = "none";

            }

        });


        if (!found && value !== "") {

            searchMessage.classList.remove("hidden");

        } else {

            searchMessage.classList.add("hidden");

        }

    }


    if (searchSubmit) {
        searchSubmit.addEventListener("click", searchCoffee);
    }


    if (searchInput) {

        searchInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {
                searchCoffee();
            }

        });

    }



    // DARK / LIGHT MODE

    const themeButton =
        document.getElementById("themeButton");


    if (themeButton) {

        if (localStorage.getItem("theme") === "dark") {

            document.body.classList.add("dark-mode");
            themeButton.textContent = "☀️";

        }


        themeButton.addEventListener("click", function () {

            document.body.classList.toggle("dark-mode");


            if (document.body.classList.contains("dark-mode")) {

                themeButton.textContent = "☀️";
                localStorage.setItem("theme", "dark");

            } else {

                themeButton.textContent = "🌙";
                localStorage.setItem("theme", "light");

            }

        });

    }



    // MOBILE MENU

    const menuButton =
        document.getElementById("menuButton");

    const mobileMenu =
        document.getElementById("mobileMenu");


    if (menuButton && mobileMenu) {

        menuButton.addEventListener("click", function () {

            mobileMenu.classList.toggle("show");

        });

    }

});

</script>
